
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya AI Chatbot</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.chatbox {
  width: 95%;
  max-width: 450px;
  height: 600px;
  background: #1e293b;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 25px #000;
}

header {
  background: #2563eb;
  padding: 20px;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
}

#messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  max-width: 85%;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.bot {
  background: #334155;
  margin-right: auto;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.input-area {
  display: flex;
  padding: 12px;
  background: #0f172a;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: none;
  border-radius: 10px;
  outline: none;
  font-size: 16px;
}

button {
  background: #22c55e;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #16a34a;
}

</style>
</head>

<body>

<div class="chatbox">

<header>🤖 Aditya AI Chatbot</header>

<div id="messages">
  <div class="message bot">
    नमस्ते आदित्य! 👋<br>
    मैं तुम्हारा AI Chatbot हूँ।<br>
    मुझसे जोड़, घटाना, गुणा और भाग पूछ सकते हो।
  </div>
</div>

<div class="input-area">
  <input id="userInput" placeholder="अपना सवाल लिखो..."
  onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">भेजें</button>
</div>

</div>

<script>

const messages = document.getElementById("messages");
const input = document.getElementById("userInput");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

// गणित का जवाब
function calculate(question) {

  let q = question.toLowerCase().trim();

  // पहले सीधे गणित का expression जाँचो
  let expression = q.match(/-?\d+(?:\.\d+)?\s*[+\-*/×÷]\s*-?\d+(?:\.\d+)?/);

  if (expression) {
    return solve(expression[0]);
  }

  // सवाल में से नंबर निकालो
  let numbers = q.match(/-?\d+(?:\.\d+)?/g);

  if (!numbers || numbers.length < 2) return null;

  let a = Number(numbers[0]);
  let b = Number(numbers[1]);

  // जोड़
  if (/जोड़|जोड़ो|जमा|plus|add|addition|\bमें मिलाओ\b/.test(q)) {
    return `${a} + ${b} = ${a + b}`;
  }

  // घटाना
  if (/घटा|घटाओ|minus|subtract|subtraction|कम करो/.test(q)) {
    // "10 में से 4 घटाओ" का जवाब 6 होगा
    if (/में से/.test(q)) {
      return `${a} - ${b} = ${a - b}`;
    }
    return `${a} - ${b} = ${a - b}`;
  }

  // गुणा
  if (/गुणा|गुणा करो|multiply|multiplication|times/.test(q)) {
    return `${a} × ${b} = ${a * b}`;
  }

  // भाग
  if (/भाग|बांटो|divide|division|divided/.test(q)) {
    if (b === 0) return "शून्य से भाग नहीं दे सकते!";
    return `${a} ÷ ${b} = ${a / b}`;
  }

  return null;
}

// Expression हल करना
function solve(exp) {
  let parts = exp.match(/(-?\d+(?:\.\d+)?)\s*([+\-*/×÷])\s*(-?\d+(?:\.\d+)?)/);

  if (!parts) return null;

  let a = Number(parts[1]);
  let op = parts[2];
  let b = Number(parts[3]);
  let result;

  switch(op) {
    case "+": result = a + b; break;
    case "-": result = a - b; break;
    case "*":
    case "×": result = a * b; break;
    case "/":
    case "÷":
      if (b === 0) return "शून्य से भाग नहीं दे सकते!";
      result = a / b;
      break;
    default: return null;
  }

  return `${a} ${op} ${b} = ${result}`;
}

function getReply(question) {

  let q = question.toLowerCase();

  // गणित
  let mathAnswer = calculate(q);
  if (mathAnswer !== null) return mathAnswer;

  // सामान्य जवाब
  if (q.includes("नमस्ते") || q.includes("hello") || q.includes("hi")) {
    return "नमस्ते आदित्य! 😊 बताओ क्या करना है?";
  }

  if (q.includes("नाम") || q.includes("name")) {
    return "मेरा नाम Aditya AI Chatbot है! 🤖";
  }

  if (q.includes("कैसे हो") || q.includes("how are you")) {
    return "मैं बिल्कुल ठीक हूँ! तुम कैसे हो? 😊";
  }

  if (q.includes("धन्यवाद") || q.includes("thank")) {
    return "तुम्हारा स्वागत है आदित्य! ❤️";
  }

  return "मुझे यह सवाल समझ नहीं आया। तुम मुझसे गणित के सवाल पूछ सकते हो, जैसे 5 + 5 या 10 में से 4 घटाओ।";
}

function sendMessage() {

  let question = input.value.trim();

  if (question === "") return;

  addMessage(question, "user");

  let answer = getReply(question);

  addMessage(answer, "bot");

  input.value = "";
  input.focus();
}

</script>

</body>
</html>
