<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 700px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #24292f;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 22px;
    }

    .chat-header p {
      margin-top: 5px;
      font-size: 13px;
      color: #c9d1d9;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f6f8fa;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.4;
      font-size: 15px;
    }

    .bot .bubble {
      background: #e1e4e8;
      color: #24292f;
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: #0969da;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .typing {
      display: none;
      padding: 10px 20px;
      color: #666;
      font-size: 13px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      gap: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #messageInput {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #0969da;
    }

    #sendButton {
      border: none;
      background: #0969da;
      color: white;
      padding: 0 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }

    #sendButton:hover {
      background: #0757b5;
    }

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <header class="chat-header">
      <h1>🤖 My Chatbot</h1>
      <p>Ask me anything</p>
    </header>

    <main id="messages" class="messages">

      <div class="message bot">
        <div class="bubble">
          Hello! 👋 I'm your chatbot. How can I help you?
        </div>
      </div>

    </main>

    <div id="typing" class="typing">
      Bot is typing...
    </div>

    <form id="chatForm" class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        required
      >

      <button id="sendButton" type="submit">
        Send
      </button>
    </form>

  </div>

  <script>
    // ==========================
    // Chatbot initialization
    // ==========================

    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const typing = document.getElementById("typing");


    // Add a message to the chat
    function addMessage(text, sender) {

      const message = document.createElement("div");
      message.className = `message ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      bubble.textContent = text;

      message.appendChild(bubble);
      messages.appendChild(message);

      // Automatically scroll to the newest message
      messages.scrollTop = messages.scrollHeight;
    }


    // Simple chatbot response
    function getBotResponse(message) {

      const text = message.toLowerCase().trim();

      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! 👋 Nice to meet you.";
      }

      if (text.includes("how are you")) {
        return "I'm doing great! 🤖";
      }

      if (text.includes("name")) {
        return "I'm My Chatbot.";
      }

      if (text.includes("github")) {
        return "You can host this chatbot using GitHub Pages.";
      }

      if (text.includes("bye")) {
        return "Goodbye! 👋";
      }

      return "I'm still learning. 🤔 You can connect me to an AI API to make me smarter!";
    }


    // Handle message submission
    chatForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const userMessage = messageInput.value.trim();

      if (!userMessage) {
        return;
      }

      // Display user message
      addMessage(userMessage, "user");

      // Clear input
      messageInput.value = "";

      // Show typing indicator
      typing.style.display = "block";

      // Generate bot response
      setTimeout(function() {

        const response = getBotResponse(userMessage);

        typing.style.display = "none";

        addMessage(response, "bot");

      }, 600);
    });


    // Focus input when page loads
    window.addEventListener("load", function() {
      messageInput.focus();
    });
  </script>

</body>
</html>
